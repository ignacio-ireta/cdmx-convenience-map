[project]
name = "cdmxmap"
version = "0.1.0"
description = "Geo data pipeline that scores city areas (postal codes / colonias) on convenience metrics and feeds a static map frontend."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "José Ignacio Esparza Ireta" }]
keywords = ["geospatial", "gis", "cdmx", "convenience", "scoring", "geojson"]

# Runtime dependencies. The geospatial stack is pinned to the versions the
# scoring output was produced with (determinism, see docs/engineering-standards.md §G).
# numpy 1.26.x is the reason requires-python is capped below 3.13; bumping to
# numpy 2.x to unlock 3.13 is a follow-up.
dependencies = [
    "geopandas==0.14.4",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyogrio==0.9.0",
    "pyproj==3.6.1",
    "requests==2.32.5",
    "shapely==2.0.7",
    "typer>=0.12,<0.16",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Schedule-aware transit routing overlay. Requires a Java 21+ runtime on PATH.
# Off by default; the pipeline falls back to the Apimetro approximation engine.
transit = ["r5py>=0.1.0"]
# Offline road routing for work/amenity travel times (driving/walking/biking).
# pyvalhalla ships prebuilt Valhalla binaries — no Docker/Java. Off by default;
# the pipeline falls back to the straight-line estimate. See docs/road-routing.md.
routing = ["pyvalhalla>=3.1.0"]

[project.urls]
Homepage = "https://github.com/ignacio-ireta/cdmx-convenience-map"

[project.scripts]
cdmxmap = "cdmxmap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdmxmap"]

# ---------------------------------------------------------------------------
# Quality gates (docs/engineering-standards.md §M)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["scripts/archive", "data", "frontend", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008", # function call in default arg — typer uses this idiom
    "B905", # zip() without strict= — stylistic; the zipped series are same-length
]

[tool.ruff.lint.per-file-ignores]
"scripts/experiments/*" = ["E501"] # experimental spikes: don't gate on line length
# These modules hold long human-readable note/limitation strings (and a long
# source URL) that feed metadata output verbatim; rewrapping them would change
# emitted text, so E501 is relaxed for them only.
"src/cdmxmap/scoring/engine.py" = ["E501"]
"src/cdmxmap/output/metadata.py" = ["E501"]
"src/cdmxmap/transit_commute/approximate.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true # geopandas/shapely/pyogrio/r5py ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow",
    "integration: multi-component tests using fixture files",
    "e2e: end-to-end CLI runs",
    "golden: golden-file comparison tests",
]
